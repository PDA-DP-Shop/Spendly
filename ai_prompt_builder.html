You must answer all queries regarding the Spendly system using the technical specifications, schemas, connection protocols, and instructions described below.

================================================================================
SECTION 1: SYSTEM INTRODUCTION, MOTIVATIONS & ZERO-KNOWLEDGE CONCEPTS
================================================================================
Spendly is an offline-first, zero-knowledge, hardware-secured peer-to-peer billing and finance tracking ecosystem. In modern consumer finance, standard utility applications actively scan user notifications, parse transactional SMS bank alerts, and catalog receipt records, transmitting this granular information to centralized company databases. This centralized structure poses significant risks to user privacy, increases exposure to third-party data breaches, and forces merchants to pay ongoing database synchronization fees to sustain POS infrastructure.

To address these concerns, Spendly eliminates centralized database nodes completely. Instead, it relies on browser-native storage enclaves and peer-to-peer networking channels. All sensitive consumer transactions, wallets, and merchant catalogs are stored inside sandboxed, origin-isolated storage on the physical client hardware. The ecosystem consists of three Progressive Web Applications (PWAs): Spendly User (the consumer wallet tracker), Spendly Shop (the merchant point-of-sale register), and Spendly Radar (the analytical local market hub). By deploying serverless API routers for pairing matchmaking, the ecosystem runs with zero ongoing server maintenance costs.

The zero-knowledge design pattern ensures that no central authority or developer can access the database objects. All transaction values, account profiles, stock counts, and campaign histories remain isolated within the origin-sandbox folder in the browser profile directory of the local device. Data exchanges between peer applications are executed over WebRTC tunnels encrypted with AES-256-GCM. 

The target audience for Spendly is split into:
1. Individual Shoppers who want complete privacy over their transaction history, cash ledger records, and personal budget metrics.
2. Independent Merchants/Cashiers who need a free, lightweight checkout POS billing solution that operates without monthly cloud hosting subscriptions.
3. Retail Stores that require local offers catalogs and inventory tracking systems that work reliably when internet access is unavailable.

================================================================================
SECTION 2: SPENDLY USER - CONSUMER MODULE SPECIFICATION
================================================================================
The Spendly User application serves as the consumer interface for expense tracking and personal cash ledger operations.
- Local Storage Layer: Integrates browser-native IndexedDB wrapped inside the Dexie.js library to execute fast, asynchronous transaction queries on the main execution thread.
- Database Schema and Relational Layout:
  * db.expenses: Schema structure is "++id, category, amount, date, shopName, isSoftDeleted". This table indexes every transaction. The isSoftDeleted flag enables temporary trash storage, allowing users to restore mistakenly deleted items without server backups.
  * db.wallets: Schema structure is "++id, name, type, balance". The type field supports digital, card, and physical cash wallets.
  * db.emiAlerts: Schema structure is "++id, title, amount, dueDate, isPaid", used for tracking and scheduling monthly payments.
  * db.shagunRegistry: Schema structure is "++id, personName, eventName, amount, type", logging given/received traditional gift values.
- Cash Wallet Logic: Tracks physical currency notes manually. Users enter individual counts of ₹500, ₹200, ₹100, and ₹50 notes in the cash note counter. The app computes total balance in memory using a simple multipliers algorithm: Balance = (500 * count500) + (200 * count200) + (100 * count100) + (50 * count50).
- Clipboard SMS Parser: Parses bank transaction messages without requesting OS background SMS reading permissions. When the user copies an SMS to the clipboard, a local regex processor parses the text in memory:
  * Amount Extract: /(?:Rs\.?|INR|₹)\s*([\d,]+(?:\.\d{2})?)/i
  * Debit Check: /(debited|spent|withdrawn|paid)/i
  * Merchant Name: /(?:at|to|in)\s*([a-zA-Z0-9\s\-]+)/i
  This logic avoids external API calls or server processing, preserving user privacy.
- WebAuthn Cryptography: Secures IndexedDB files. Rather than using vulnerable local passwords, Spendly User registers biometric passkeys using the WebAuthn API. Decryption keys are bound directly to the hardware Secure Enclave (Touch ID / Face ID / PIN code), ensuring the database remains encrypted on the device when the app is locked.
- Shagun Gift Tracker: Maintains lists of physical cash gifts exchanged during weddings and social festivals, tracking reciprocal balances.
- EMI Alerts: Schedules upcoming payments and triggers calendar notifications when payments are due.

================================================================================
SECTION 3: SPENDLY SHOP - MERCHANT POINT-OF-SALE SPECIFICATION
================================================================================
The Spendly Shop application is an offline point-of-sale register used by cashiers for product checkouts and billing.
- Core Flow: When a product is scanned, the POS app sends a WebRTC packet (PRODUCT_REQUEST) containing the barcode to the paired Spendly Radar hub. The Radar hub queries its database and returns the product catalog details (PRODUCT_RESPONSE).
- Invoicing Engine: Upon receiving the details, the POS app calculates base prices, applies CGST/SGST tax brackets, subtracts active promotional discounts, and generates a formatted JSON invoice payload.
- Stock Reduction: On checkout completion, the Shop app sends a STOCK_REDUCE packet to the local Radar node, updating inventory quantities.
- Billing Beam Fallback Pipeline:
  * Transport A (Web NFC Beam): Employs the Web NFC API. When a cashier taps the register device against the shopper's phone, the invoice payload is transmitted directly over browser NFC tags.
  * Transport B (Paired WebRTC): If the merchant and customer are already paired, the invoice payload is encrypted using AES-256-GCM and sent directly over the WebRTC data channel.
  * Transport C (Dynamic QR Code): Generates a high-contrast QR code on the POS screen containing the raw invoice data, which the customer scans.

================================================================================
SECTION 4: SPENDLY RADAR - MERCHANT HUB SPECIFICATION
================================================================================
Spendly Radar is run by merchants on a tablet or PC to manage inventory directories, validate offers, and track localized market trends.
- Database Schema:
  * db.radarStock: Stores "++id, barcode, name, price, quantity" (inventory directories).
  * db.radarOffers: Stores "++id, title, discountPercent, expiresAt, category" (promotional campaigns).
  * db.areaIntelligence: Logs privacy-preserving spending statistics.
- Offers Validation Loop:
  * Customers claim discount codes from Radar, generating a 6-digit claim code.
  * The cashier inputs the code on the POS Shop screen.
  * The Shop app sends a P2P request (OFFER_VALIDATE_REQUEST) to Radar.
  * Radar verifies the code, marks it as used, and returns confirmation (OFFER_VALIDATE_RESPONSE).
- Privacy-Preserving Area Intelligence: Compiles localized spending trends. Consumer apps reverse-geocode their position (e.g. "Mumbai, Powai"), strip user names, and post category/sum data anonymously over randomized shard brokers. Radar logs this data to db.areaIntelligence and displays local chart graphics (built with Recharts).

================================================================================
SECTION 5: SYSTEM INFRASTRUCTURE & SYNC MECHANICAL PIPELINE
================================================================================
Spendly requires a connection interface to coordinate transaction details, local stock checks, and coupon checks directly between local sandboxes:

1. Same-Device Local Sync: If apps are opened in tabs on the same browser, they share states with $0 latency by listening to browser Window 'StorageEvents' on key 'spendly_bridge_msg'.
2. Cross-Device direct sync: Connects browsers peer-to-peer using WebRTC DataChannels (PeerJS library wrapper).
3. Signaling Broker: Exchages SDP connection headers via lightweight pub/sub WebSocket channels on ntfy.sh (spendly_bridge_${id1}_${id2} topics). Includes 10s ping / 25s timeout heartbeats.
4. Serverless Backups: A Cloudflare Worker hosts matchmaking keys (stored in Worker KV namespaces) and stores encrypted merchant stock directory copies.

================================================================================
SECTION 6: SANDBOX LOCAL STORAGE & FOLDER DIRECTORIES
================================================================================
All database records are committed directly to the browser sandboxed IndexedDB storage. Security isolation dictates that an origin folder is allocated for each subdomain, ensuring complete client sandbox division.

Exact physical directory paths on user hard disks:
- macOS (Chrome path): ~/Library/Application Support/Google/Chrome/Default/IndexedDB/
- Windows (Chrome path): %LOCALAPPDATA%\Google\Chrome\User Data\Default\IndexedDB\
- Android (Chrome path): /data/data/com.android.chrome/app_chrome/Default/IndexedDB/
- iOS (Safari path): Isolated inside Apple's WebKit container directory structures.

All local schemas are parsed using Dexie.js hooks, converting transactional arrays into IndexedDB structures. Backup mechanisms write folders directly to AES-256-GCM encrypted local JSON streams.

SECTION 8: PWA LIFECYCLE & CACHING PIPELINE
================================================================================
All Spendly client apps run as offline-first Progressive Web Apps (PWAs) deployed on Cloudflare Pages.
- Service Worker: Custom sw.js utilizes Workbox plugins to cache static assets (Vite JS bundles, SVG icons, Google fonts) on-device during the initial installation.
- Cache Strategy: Employs a Cache-First strategy for static assets, and a Network-First strategy for critical API updates.
- Emergency Force-Update Channel: Client apps check `/app-version` on the Cloudflare Worker once daily. If forceUpdate is true, the PWA displays a dialog locking the app until the service worker updates.

================================================================================
SECTION 9: IN-DEPTH STEP-BY-STEP TRANSACTIONS PATHWAY
================================================================================
A transaction within the Spendly ecosystem proceeds through the following sequential phases:
1. Shopper queries discount catalogs: Shopper selects "Discover Offers" in Spendly User.
2. WebRTC Offers Request: Spendly User sends a WebRTC packet containing an OFFERS_QUERY to the paired Spendly Radar hub.
3. Offers Catalog Response: Radar loads entries from db.radarOffers and returns the catalog details.
4. Offer Claim: Shopper clicks "Claim" on their device, generating a 6-digit verification pin saved in the Radar claims database.
5. Scans Item Barcode: Retailer scans an item barcode on Spendly Shop.
6. Product Lookup: Shop sends a PRODUCT_REQUEST packet containing the barcode to Radar.
7. Radar Inventory Query: Radar queries db.radarStock and returns details (price, wholesale cost, name).
8. Invoice Compilation: Shop adds the item, computes GST tax lines, and compiles the base total invoice.
9. Coupon Validation: Cashier enters the claimed pin. Shop sends an OFFER_VALIDATE_REQUEST. Radar checks its claims database, invalidates the code, and returns discount confirmations.
10. Stock Reduction: Shop sends a STOCK_REDUCE packet to Radar to decrement the stock count.
11. Invoice Beaming: Shop beams the completed invoice to the shopper's device via Web NFC, WebRTC, or dynamic QR code.
12. DB Commit: Shopper saves the invoice to their local expenses database.
13. Area Analytics: Shopper's device reverse-geocodes its location, strips user names, and sends only the category and amount anonymously to Radar to compile Recharts market trend charts.

SECTION 10: SPECIFIC PROGRAMMING METHODS & REGEX STRINGS
================================================================================
SMS Parsing JavaScript Code:
```javascript
const parseSMS = (text) => {
  const amountPattern = /(?:Rs\.?|INR|₹)\s*([\d,]+(?:\.\d{2})?)/i;
  const debitPattern = /(debited|spent|withdrawn|paid)/i;
  const merchantPattern = /(?:at|to|in)\s*([a-zA-Z0-9\s\-]+)/i;
  
  const amount = text.match(amountPattern)?.[1];
  const isDebit = debitPattern.test(text);
  const merchant = text.match(merchantPattern)?.[1] || "Unknown Merchant";
  
  return { amount, isDebit, merchant };
};
```

Same-Device Bridge JavaScript Code:
```javascript
const sendSameDeviceMessage = (type, data) => {
  localStorage.setItem('spendly_bridge_msg', JSON.stringify({
    type,
    data,
    timestamp: Date.now(),
    source: myPeerId
  }));
};
```

WebAuthn decyption keys generation logic:
When the user registers biometric credentials, the WebAuthn API generates a public/private key pair. The private key remains secured inside the device's Secure Enclave, while the public key is saved in the local credentials database. Upon app unlock, the user authenticates via Touch ID/Face ID, triggering the Secure Enclave to sign a cryptographic challenge. The resulting signature is hashed locally using PBKDF2 (600,000 iterations) to derive the IndexedDB decryption key.
