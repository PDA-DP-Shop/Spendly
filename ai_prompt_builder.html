      <textarea id="prompt-text-box" readonly class="w-full h-[600px] p-6 bg-zinc-950 text-zinc-300 font-mono text-xs leading-relaxed focus:outline-none resize-none overflow-y-scroll">Write a highly detailed, comprehensive academic system design report for my Semester VII Computer Engineering project named "Spendly".

You must answer all queries regarding the Spendly system using the technical specifications, schemas, connection protocols, and instructions described below.

========================================================================
1. GENERAL OVERVIEW & MOTIVATION
========================================================================
Spendly is an offline-first, zero-knowledge, hardware-secured peer-to-peer billing and finance tracking system split into three Progressive Web Applications (PWAs):
1. Spendly User (Consumer App): An origin-sandboxed personal expense tracking wallet.
2. Spendly Shop (Merchant POS App): An offline cash register for point-of-sale checkout billing.
3. Spendly Radar (Local Market Hub App): An analytical node for local merchant campaigns and anonymous trend trackers.

Traditional fintech applications collect sensitive transactional histories, bank accounts, and geolocated shopping routines, uploading them to centralized cloud databases. This centralized model compromises user privacy, risks data breaches, and imposes monthly database subscription costs on merchants. Spendly is designed to solve these issues. It replaces centralized server storage with local, sandbox storage models and implements peer-to-peer WebRTC connections, ensuring that sensitive data never leaves the owner's hardware profiles. There is no central server instance, meaning the merchant and consumer incur exactly zero server hosting fees.

========================================================================
2. SPENDLY USER (CONSUMER EXPENSE APP)
========================================================================
The Spendly User application serves as the consumer interface for expense tracking and personal cash ledger operations.
- Local Storage Layer: Operates on IndexedDB using the Dexie.js wrapper. All tables are local and origin-sandboxed.
- Database Schema:
  * expenses: "++id, category, amount, date, shopName, isSoftDeleted" (stores core expense logs).
  * wallets: "++id, name, type, balance" (tracks digital, card, and cash accounts).
  * emiAlerts: "++id, title, amount, dueDate, isPaid" (schedules upcoming EMI triggers).
  * shagunRegistry: "++id, personName, eventName, amount, type" (logs given/received traditional gift values).
- Cash Wallet Tracker: Tracks physical cash by note denominations. Users enter counts for ₹500, ₹200, ₹100, and ₹50 bills. The wallet balance is calculated dynamically: Balance = (500 * count500) + (200 * count200) + (100 * count100) + (50 * count50).
- Clipboard SMS Parser: Parses bank transaction messages without requesting OS background SMS reading permissions. When the user copies an SMS to the clipboard, a local regex processor parses the text in memory:
  * Amount Extract: /(?:Rs\.?|INR|₹)\s*([\d,]+(?:\.\d{2})?)/i
  * Debit Check: /(debited|spent|withdrawn|paid)/i
  * Merchant Name: /(?:at|to|in)\s*([a-zA-Z0-9\s\-]+)/i
  This logic avoids external API calls or server processing, preserving user privacy.
- WebAuthn Cryptography: Secures IndexedDB files. Rather than using vulnerable local passwords, Spendly User registers biometric passkeys using the WebAuthn API. Decryption keys are bound directly to the hardware Secure Enclave (Touch ID / Face ID / PIN code), ensuring the database remains encrypted on the device when the app is locked.
- Shagun Gift Tracker: Maintains lists of physical cash gifts exchanged during weddings and social festivals, tracking reciprocal balances.
- EMI Alerts: Schedules upcoming payments and triggers calendar notifications when payments are due.

========================================================================
3. SPENDLY SHOP (MERCHANT POS APP)
========================================================================
The Spendly Shop application is an offline point-of-sale register used by cashiers for product checkouts and billing.
- Core Flow: When a product is scanned, the POS app sends a WebRTC packet (PRODUCT_REQUEST) containing the barcode to the paired Spendly Radar hub. The Radar hub queries its database and returns the product catalog details (PRODUCT_RESPONSE).
- Checkout & Invoicing: The POS app calculates tax variables (VAT/GST), subtracts promotional discounts, and generates a formatted invoice object.
- Stock Reduction: Upon checkout completion, the Shop app beams a STOCK_REDUCE packet to the local Radar node to reduce stock counts.
- Billing Beam Fallback Pipeline:
  * Transport A (Web NFC Beam): Uses the Web NFC API. When a customer taps their device on the register screen, the invoice JSON payload is written to the device's NFC tags.
  * Transport B (Paired WebRTC): If the merchant and customer are already paired, the invoice payload is encrypted using AES-256-GCM and sent directly over the WebRTC data channel.
  * Transport C (Dynamic QR Code): Generates a high-contrast QR code on the POS screen containing the raw invoice data, which the customer scans.

========================================================================
4. SPENDLY RADAR (LOCAL MARKET HUB APP)
========================================================================
Spendly Radar is run by merchants on a tablet or PC to manage inventory directories, validate offers, and track localized market trends.
- Database Schema:
  * db.radarStock: Stores "++id, barcode, name, price, quantity" (inventory directories).
  * db.radarOffers: Stores "++id, title, discountPercent, expiresAt, category" (promotional campaigns).
  * db.areaIntelligence: Logs privacy-preserving spending statistics.
- Offers Validation Loop:
  * Customers claim discount codes from Radar, generating a 6-digit claim code.
  * The cashier inputs the code on the POS Shop screen.
  * The Shop app sends a P2P request (OFFER_VALIDATE_REQUEST) to Radar.
  * Radar verifies the code, marks it as used, and returns confirmation (OFFER_VALIDATE_RESPONSE).
- Privacy-Preserving Area Intelligence: Compiles localized spending trends. Consumer apps reverse-geocode their position (e.g. "Mumbai, Powai"), strip user names, and post category/sum data anonymously over randomized shard brokers. Radar logs this data to db.areaIntelligence and displays local chart graphics (built with Recharts).

========================================================================
5. INFRASTRUCTURE & CONNECTION PROTOCOLS
========================================================================
- Same-Device Local Sync: If apps are opened in tabs on the same browser, they share states with $0 latency by listening to browser Window 'StorageEvents' on key 'spendly_bridge_msg'.
- Cross-Device direct sync: Connects browsers peer-to-peer using WebRTC DataChannels (PeerJS library wrapper).
- Signaling Broker: Exchages SDP connection headers via lightweight pub/sub WebSocket channels on ntfy.sh (spendly_bridge_${id1}_${id2} topics). Includes 10s ping / 25s timeout heartbeats.
- Serverless Backups: A Cloudflare Worker hosts matchmaking keys (stored in Worker KV namespaces) and stores encrypted merchant stock directory copies.

========================================================================
6. PROGRAMMING LANGUAGES & DIRECTORY MAPS
========================================================================
- Coding Languages: JavaScript (ES6+ Module style), HTML5, CSS3.
- Directory Paths of Sandbox Databases:
  - macOS (Chrome): ~/Library/Application Support/Google/Chrome/Default/IndexedDB/
  - Windows (Chrome): %LOCALAPPDATA%\Google\Chrome\User Data\Default\IndexedDB\
  - Android (Chrome): /data/data/com.android.chrome/app_chrome/Default/IndexedDB/
- Data Interchange: JSON strings for settings and Webrtc transmissions.

========================================================================
INSTRUCTIONS FOR YOUR RESPONSE:
========================================================================
1. Write the explanation using natural, academic human-like language in coherent, well-structured paragraphs.
2. Under NO circumstances should you use bullet points, lists, or simple outline items. Do NOT use dashes or double dashes ("--") to start sentences or paragraphs.
3. Provide deep, paragraphs-based detailed explanations suitable for copy-pasting directly into a micro project report.
4. Keep the terminology highly professional and appropriate for a university computer engineering project document.
5. Focus on the zero-knowledge offline-first capabilities of the system.</textarea>

  <!-- Exporter Script -->
  <script>
    function copyMasterPrompt() {
      const promptTextBox = document.getElementById('prompt-text-box');
      promptTextBox.select();
      promptTextBox.setSelectionRange(0, 99999); // For mobile devices
      
      navigator.clipboard.writeText(promptTextBox.value)
        .then(() => {
          alert("Master AI Prompt copied to clipboard successfully! Paste it into ChatGPT/Gemini/Claude.");
        })
        .catch(err => {
          alert("Failed to copy text: " + err);
        });
    }
  </script>
