You must answer all queries regarding the Spendly system using the technical specifications, schemas, connection protocols, and instructions described below.

========================================================================
1. GENERAL OVERVIEW, ARCHITECTURE MOTIVATIONS & ECOSYSTEM GOALS
========================================================================
Spendly represents a zero-knowledge, offline-first, hardware-secured peer-to-peer billing and finance tracking ecosystem. In modern consumer finance, standard utility applications actively scan user notifications, parse transactional SMS bank alerts, and catalog receipt records, transmitting this granular information to centralized company databases. This centralized structure poses significant risks to user privacy, increases exposure to third-party data breaches, and forces merchants to pay ongoing database synchronization fees to sustain POS infrastructure.

To address these concerns, Spendly eliminates centralized database nodes completely. Instead, it relies on browser-native storage enclaves and peer-to-peer networking channels. All sensitive consumer transactions, wallets, and merchant catalogs are stored inside sandboxed, origin-isolated storage on the physical client hardware. The ecosystem consists of three Progressive Web Applications (PWAs): Spendly User (the consumer wallet tracker), Spendly Shop (the merchant point-of-sale register), and Spendly Radar (the analytical local market hub). By deploying serverless API routers for pairing matchmaking, the ecosystem runs with zero ongoing server maintenance costs.

The target audience for Spendly is split into:
1. Individual Shoppers who want complete privacy over their transaction history, cash ledger records, and personal budget metrics.
2. Independent Merchants/Cashiers who need a free, lightweight checkout POS billing solution that operates without monthly cloud hosting subscriptions.
3. Retail Stores that require local offers catalogs and inventory tracking systems that work reliably when internet access is unavailable.

========================================================================
2. DETAILED APP WORKINGS & FEATURE WORKFLOWS
========================================================================
SPENDLY USER (CONSUMER WALLET APP):
- Goal: Allows users to log personal expenditures, manage notes in a cash wallet, parse transaction text alerts, and secure databases.
- Screen & Feature Flow:
  * HomeScreen: Shows overall balance metrics, category-wise expenditure charts, and quick shortcut actions.
  * Cash Wallet: A physical cash note tracker. Users manually click counter buttons to update the counts of their physical cash notes (₹500, ₹200, ₹100, and ₹50 notes). The app calculates balances locally: (500 * count500) + (200 * count200) + (100 * count100) + (50 * count50).
  * SMS Parser Console: Users paste text alerts copied from the clipboard. A regex utility automatically extracts:
    - Amount: /(?:Rs\.?|INR|₹)\s*([\d,]+(?:\.\d{2})?)/i
    - Debit status: /(debited|spent|withdrawn|paid)/i
    - Merchant name: /(?:at|to|in)\s*([a-zA-Z0-9\s\-]+)/i
    The data is formatted into an expense object and saved directly to the local IndexedDB.
  * Shagun gifts tracker: A separate tab where users log cash gifts given to or received from relatives during traditional ceremonies (e.g. weddings, Diwali) to track reciprocal balances.
  * LockScreen: When opened, the app requests credential validation using the WebAuthn API. If successful, the app decrypts the database credentials and allows user access.

SPENDLY SHOP (POS BILLING APP):
- Goal: Used by merchant cashiers on a register device to manage checkouts.
- Screen & Feature Flow:
  * POS Register Panel: The cashier scans barcode labels using the device camera. The shop app queries the paired Spendly Radar hub via WebRTC to fetch item descriptions and retail prices.
  * Tax & GST Calculator: Automatically calculates tax rates (CGST/SGST/IGST) based on item categories and compiles total invoices.
  * Beam Invoice screen: Triggers the billing beam transmission. Cashiers tap the shopper's device (Web NFC Beam), send data over paired WebRTC channels, or generate a dynamic checkout QR code for shoppers to scan.

SPENDLY RADAR (LOCAL HUB APP):
- Goal: Managed by store owners to configure store inventory, update catalogs, issue offers, and display transaction analytics.
- Screen & Feature Flow:
  * Stock Panel: Stores list of items, item barcodes, retail prices, and wholesale purchase costs.
  * Offers Panel: Displays active discount codes, claims list, and validity parameters.
  * Analytics Console: Renders charts showing overall store sales and area intelligence graphs (built using Recharts).

========================================================================
3. THE CONNECTION MATRIX: WHY AND HOW THEY CONNECT
========================================================================
WHY THEY CONNECT:
The apps must communicate to exchange billing records, inventory catalog prices, and discount validations. In standard POS environments, this sync is managed by a centralized cloud database. In Spendly, this sync happens directly between local devices. This architecture ensures complete user privacy (data is never sent to third-party servers) and removes merchant server operating costs.

HOW THEY CONNECT:
- Network Layer A (Direct WebRTC): Browser-to-browser P2P communication. Coordinated via the PeerJS client library, letting Spendly Shop establish direct, bi-directional streams with Spendly Radar and Spendly User.
- Network Layer B (ntfy.sh WebSocket Broker): Acts as the signaling broker for WebRTC. Standard WebRTC requires exchanging Session Description Protocol (SDP) configurations. Since there are no custom backend servers, the apps establish WebRTC handshakes by posting encrypted SDP keys over ntfy.sh WebSocket bridge topics (`spendly_bridge_${smallerPeerId}_${largerPeerId}`). Connection integrity is maintained with a 10s ping interval and 25s timeout threshold.
- Network Layer C (LocalStorage same-device bridge): If the apps are opened in different tabs on the same browser window, they share states with $0 latency by listening to browser Window 'StorageEvents' on key 'spendly_bridge_msg'.
- Network Layer D (Cloudflare Worker KV pairing): To pair devices, Radar generates a temporary 6-digit pin and posts it along with its Peer ID to the Cloudflare Worker API. Shop inputs the pin, queries the Worker to retrieve the Peer ID, and deletes the entry from KV storage.

========================================================================
4. HOW LOCAL STORAGE WORKS & SANDBOX MECHANICS
========================================================================
HOW DATA IS STORED:
- Database Engine: Browser-native IndexedDB wrapped inside the Dexie.js library to execute fast, asynchronous transaction queries on the main execution thread.
- Sandbox Mechanics: Browser security enforces origin isolation. This sandbox means that `spendly-shop` cannot query tables generated by `spendly-user`, keeping consumer and retailer databases completely separated.
- Directory Paths of Sandbox Databases:
  * macOS (Chrome path): ~/Library/Application Support/Google/Chrome/Default/IndexedDB/
  * Windows (Chrome path): %LOCALAPPDATA%\Google\Chrome\User Data\Default\IndexedDB\
  * Android (Chrome path): /data/data/com.android.chrome/app_chrome/Default/IndexedDB/
- Backup File Format: Local databases can be exported as custom `.spendly` JSON files encrypted on the client side using AES-256-GCM.

========================================================================
5. FRONTEND & BACKEND LANGUAGES & TECHNOLOGIES
========================================================================
FRONTEND STACK:
- React (v18/19): Single Page Application (SPA) framework.
- Vite: Compiler and bundler for fast development builds.
- Zustand: Asynchronous client-side state store.
- Tailwind CSS & PostCSS: Responsive utility styling.
- Framer Motion: Micro-animations and page transitions.

BACKEND STACK (Serverless):
- Cloudflare Workers: Serverless V8 runtimes hosting matchmaking REST endpoints (`/api/bridge/code`, `/api/bridge/verify`, `/app-version`).
- Cloudflare KV Namespaces: Distributed key-value stores (`SPENDLY_STOCK` and `SPENDLY_DATA`) for database caching.
- ntfy.sh WebSocket Broker: Public broker running over `wss://ntfy.sh/` to handle connection signals.

========================================================================
6. INTER-APP WORKFLOW & TRANSACTION LIFECYCLE
========================================================================
When a customer checks out at a store, the transaction executes through the following steps:
1. Product Scanning: The cashier scans an item barcode on Spendly Shop.
2. Catalog Lookup: Shop sends a `PRODUCT_REQUEST` query to Radar. Radar reads `db.radarStock` and returns product details.
3. Offer Validation: If the customer presents a claimed discount code, Shop sends an `OFFER_VALIDATE_REQUEST` to Radar. Radar checks its claims database, invalidates the code, and returns discount confirmations.
4. Stock Reduction: Shop compiles the invoice and sends a `STOCK_REDUCE` query to Radar to update inventory stock counts.
5. Billing Beam: Shop beams the completed invoice to the shopper's device via Web NFC beam taps, direct WebRTC, or screen QR code scans.
6. DB Save: The shopper imports the invoice into their local expenses database.
7. Anonymous Analytics: The shopper's device reverse-geocodes its location, strips user names, and sends only the category and amount anonymously to Radar to compile Recharts market trend charts.
