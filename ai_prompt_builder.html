<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly Master AI Prompt Console</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0b0b;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .console-card {
      background-color: #121212;
      border: 1px solid #262626;
    }
  </style>
</head>
<body class="p-6 md:p-12">
  <div class="max-w-5xl mx-auto">
    <header class="mb-10 border-b border-zinc-800 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">🤖 Spendly Master AI Prompt Console</h1>
        <p class="text-zinc-400 text-sm">Copy the complete, highly-detailed project context prompt directly for ChatGPT, Gemini, or Claude.</p>
      </div>
      <button onclick="copyMasterPrompt()" class="px-5 py-2.5 bg-white text-black font-bold text-sm rounded shadow hover:bg-zinc-200 transition">
        📋 Copy Master Prompt
      </button>
    </header>

    <!-- Console Terminal -->
    <div class="console-card rounded-xl overflow-hidden shadow-2xl">
      <div class="bg-zinc-900 px-4 py-3 border-b border-zinc-850 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-500"></span>
          <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
          <span class="w-3 h-3 rounded-full bg-green-500"></span>
          <span class="text-xs text-zinc-500 font-mono ml-2">spendly-mega-prompt.txt</span>
        </div>
        <span class="text-[10px] text-zinc-500 font-mono uppercase">Full Context & Guidelines</span>
      </div>
      <textarea id="prompt-text-box" readonly class="w-full h-[600px] p-6 bg-zinc-950 text-zinc-300 font-mono text-xs leading-relaxed focus:outline-none resize-none overflow-y-scroll">Write a highly detailed, comprehensive academic system design report for my Semester VII Computer Engineering project named "Spendly".

You must answer all queries regarding the Spendly system using the technical specifications, schemas, connection protocols, and instructions described below.

========================================================================
1. GENERAL OVERVIEW & MOTIVATION
========================================================================
Spendly is an offline-first, zero-knowledge, hardware-secured peer-to-peer billing and finance ecosystem. It is designed to replace centralized fintech apps that scan bank messages and send user data to cloud servers. Spendly operates entirely on the user's local hardware sandbox without server fees or cloud databases.

The system is split into three Progressive Web Applications (PWAs):
1. Spendly User (Consumer App): An origin-sandboxed personal expense tracking wallet.
2. Spendly Shop (Merchant POS App): An offline cash register for point-of-sale checkout billing.
3. Spendly Radar (Local Market Hub App): An analytical node for local merchant campaigns and anonymous trend trackers.

========================================================================
2. SPENDLY USER (CONSUMER EXPENSE APP)
========================================================================
- Role: Allows consumers to manage finances, track cash wallets, parse clipboard transactions, and receive secure invoices.
- Database: Browser-native IndexedDB managed via Dexie.js (Origin sandboxed).
- Cash Wallet: Features a note tracker. Users manually input physical denomination counts (₹500, ₹200, ₹100, and ₹50 bills). The system calculates the physical balance dynamically:
  Total Cash = (500 * count500) + (200 * count200) + (100 * count100) + (50 * count50).
- Clipboard SMS Parser: A secure local regex processor. Instead of asking for OS background SMS permissions, it parses copied alerts:
  Regex for Amount: /(?:Rs\.?|INR|₹)\s*([\d,]+(?:\.\d{2})?)/i
  Regex for Debit Flag: /(debited|spent|withdrawn|paid)/i
  Regex for Merchant: /(?:at|to|in)\s*([a-zA-Z0-9\s\-]+)/i
  This runs in memory locally, keeping transaction scan files out of external network calls.
- WebAuthn Lock: Secures local databases. The app calls the WebAuthn API to register/assert cryptographic credentials, linking local Dexie.js decryption keys to the hardware Secure Enclave (Touch ID / Face ID / PIN code).
- Shagun Gifts Ledger: Tracks given/received gift amounts for weddings/festivals, maintaining balance lists.
- EMI Alerts: Triggers calendar schedule notifications for upcoming EMIs.

========================================================================
3. SPENDLY SHOP (MERCHANT POS APP)
========================================================================
- Role: An offline cash register used by checkout cashiers.
- Core Flow: Cashier scans product barcodes -> sends direct WebRTC messages (PRODUCT_REQUEST) to Radar -> Radar returns details -> Shop computes VAT/GST, adds items to invoice, and completes checkout.
- Stock Reduction: Upon checkout complete, Shop sends a STOCK_REDUCE packet to the local Radar node, updating stock quantities.
- Billing Beam Fallback Pipeline:
  - Transport A (Web NFC Beam): Employs Web NFC API. Customer taps device to register screen; the invoice payload is transmitted directly via browser NFC tags.
  - Transport B (Paired WebRTC): If devices are already paired, the invoice payload is encrypted via AES-256-GCM and sent directly over the data channel.
  - Transport C (Dynamic QR Code): Generates a high-contrast QR code on the register screen containing the raw invoice data, which the customer scans.

========================================================================
4. SPENDLY RADAR (LOCAL MARKET HUB APP)
========================================================================
- Role: Runs on a merchant hub tablet/PC to manage catalog records, offer validation claims, and display trends.
- Database Schema:
  - db.radarStock: Stores items, catalog barcodes, wholesale prices, and retail counts.
  - db.radarOffers: Stores active campaigns, discount parameters, and validation codes.
  - db.areaIntelligence: Logs privacy-preserving spending statistics.
- Offers Validation Loop:
  - User claims a discount code from Radar (generating a 6-digit verification pin).
  - Cashier enters the pin on Shop screen.
  - Shop sends P2P validation request to Radar (OFFER_VALIDATE_REQUEST).
  - Radar verifies key, marks it used, and returns confirmation (OFFER_VALIDATE_RESPONSE).
- Privacy-Preserving Area Intelligence: Compiles localized spending trends. Consumer apps reverse-geocode their position (e.g. "Mumbai, Powai"), strip names/details, and post category/sum data anonymously over randomized shard brokers. Radar logs this data to db.areaIntelligence and displays local chart graphics (built with Recharts).

========================================================================
5. INFRASTRUCTURE & CONNECTION PROTOCOLS
========================================================================
- Same-Device Local Sync: If apps are opened in tabs on the same browser, they share states with $0 latency by listening to browser Window 'StorageEvents' on key 'spendly_bridge_msg'.
- Cross-Device direct sync: Connects browsers peer-to-peer using WebRTC DataChannels (PeerJS library wrapper).
- Signaling Broker: Exchages SDP connection headers via lightweight pub/sub WebSocket channels on ntfy.sh (spendly_bridge_${id1}_${id2} topics). Includes 10s ping / 25s timeout heartbeats.
- Serverless Backups: A Cloudflare Worker hosts matchmaking keys (stored in Worker KV namespaces) and stores encrypted merchant stock directory copies.

========================================================================
6. PROGRAMMING LANGUAGES & DIRECTORY MAPS
========================================================================
- Coding Languages: JavaScript (ES6+ Module style), HTML5, CSS3.
- Directory Paths of Sandbox Databases:
  - macOS (Chrome): ~/Library/Application Support/Google/Chrome/Default/IndexedDB/
  - Windows (Chrome): %LOCALAPPDATA%\Google\Chrome\User Data\Default\IndexedDB\
  - Android (Chrome): /data/data/com.android.chrome/app_chrome/Default/IndexedDB/
- Data Interchange: JSON strings for settings and Webrtc transmissions.

========================================================================
INSTRUCTIONS FOR YOUR RESPONSE:
========================================================================
1. Write the explanation using natural, academic human-like language in coherent, well-structured paragraphs.
2. Under NO circumstances should you use bullet points, lists, or simple outline items. Do NOT use dashes or double dashes ("--") to start sentences or paragraphs.
3. Provide deep, paragraphs-based detailed explanations suitable for copy-pasting directly into a micro project report.
4. Keep the terminology highly professional and appropriate for a university computer engineering project document.
5. Focus on the zero-knowledge offline-first capabilities of the system.</textarea>
    </div>

  </div>

  <!-- Exporter Script -->
  <script>
    function copyMasterPrompt() {
      const promptTextBox = document.getElementById('prompt-text-box');
      promptTextBox.select();
      promptTextBox.setSelectionRange(0, 99999); // For mobile devices
      
      navigator.clipboard.writeText(promptTextBox.value)
        .then(() => {
          alert("Master AI Prompt copied to clipboard successfully! Paste it into ChatGPT/Gemini/Claude.");
        })
        .catch(err => {
          alert("Failed to copy text: " + err);
        });
    }
  </script>
</body>
</html>
